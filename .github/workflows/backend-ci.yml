name: Backend MySQL CI
on:
  push:
    branches: [main, 'codex/mysql-backend*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_disposable_password
          MYSQL_DATABASE: arboris_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_disposable_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:game
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: mysql://root:ci_disposable_password@127.0.0.1:3306/arboris_test
          REQUIRE_MYSQL_TESTS: 'true'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          TEST_DATABASE_URL: mysql://root:ci_disposable_password@127.0.0.1:3306/arboris_test
