# ====================================================================
# ARBORIS - NGINX CONFIGURATION FOR 512 MB RAM LINUX VPS
# Memory footprint: ~15 MB RAM
# ====================================================================

user www-data;
worker_processes 1; # 1 vCPU budget
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 512; # Sufficient for high concurrency on 512MB RAM
    multi_accept on;
    use epoll;
}

http {
    ##
    # Basic Low-Memory Tuning
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 25;
    types_hash_max_size 2048;
    server_tokens off;

    # Small client buffers
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 2M; # No big uploads needed
    large_client_header_buffers 2 2k;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging (Buffered to reduce SSD write amplification)
    ##
    access_log /var/log/nginx/arboris_access.log combined buffer=16k flush=5m;
    error_log /var/log/nginx/arboris_error.log warn;

    ##
    # Gzip Compression (Level 4 minimizes CPU on 1 vCPU while saving bandwidth)
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    ##
    # Server Block
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name arboris.local seu-dominio.com.br;

        root /var/www/arboris/public;
        index index.php index.html;

        # Strict Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Static Assets with aggressive browser caching
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Main Entry Point Route (Front Controller)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM FastCGI Handler
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            # FastCGI buffer limits
            fastcgi_buffer_size 8k;
            fastcgi_buffers 8 8k;
            fastcgi_busy_buffers_size 16k;
            fastcgi_temp_file_write_size 32k;
            fastcgi_read_timeout 30s;
        }

        # Block access to database, hidden files, and source code
        location ~* \.(sqlite|sqlite3|db|env|log|md|sql)$ {
            deny all;
            return 404;
        }
        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }
        location ^~ /database/ {
            deny all;
            return 404;
        }
        location ^~ /src/ {
            deny all;
            return 404;
        }
        location ^~ /views/ {
            deny all;
            return 404;
        }
    }
}
