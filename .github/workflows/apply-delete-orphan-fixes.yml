name: Apply member and tree deletion fixes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-delete-orphan-fixes.py'
      - '.github/workflows/apply-delete-orphan-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch script
        run: python scripts/apply-delete-orphan-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Backend tests
        run: npm run test:api
      - name: Game tests
        run: npm run test:game
      - name: Build frontend
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/adminGameEngine.ts src/services/directAdminActions.ts server/actions.ts server/db.ts src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: add hard delete and orphan members"
            git push
          fi
