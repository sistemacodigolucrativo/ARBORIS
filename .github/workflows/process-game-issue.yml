name: Process Game Issue

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: game-json-write
  cancel-in-progress: false

jobs:
  process-game-issue:
    name: Processar solicitacao do jogo
    if: startsWith(github.event.issue.title, '[ARBORIS_ACTION]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Extract action payload
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/```json\s*([\s\S]*?)```/i);

          if (!match) {
            throw new Error('Bloco JSON da acao nao encontrado na issue.');
          }

          const payload = JSON.parse(match[1]);
          const allowed = new Set([
            'register_participant',
            'strengthen_tronco',
            'create_tree',
            'archive_tree',
            'assign_tree_position',
            'clear_tree_position'
          ]);

          if (!allowed.has(payload.action)) {
            throw new Error(`Acao nao permitida por issue publica: ${payload.action}`);
          }

          if (!payload.idempotencyKey || typeof payload.idempotencyKey !== 'string') {
            throw new Error('idempotencyKey obrigatoria.');
          }

          fs.writeFileSync('.github-action-payload.json', JSON.stringify(payload), 'utf8');
          NODE

      - name: Validate and update JSON database
        id: run_engine
        env:
          GITHUB_REQUEST_ACTOR: ${{ github.event.issue.user.login }}
          ARBORIS_ADMIN_GITHUB_ACTORS: ${{ vars.ARBORIS_ADMIN_GITHUB_ACTORS }}
        run: |
          GAME_ACTION_PAYLOAD="$(cat .github-action-payload.json)" npx tsx scripts/process-game-action.ts

      - name: Commit JSON database changes
        id: commit_data
        run: |
          git config --global user.name "Arboris Bot"
          git config --global user.email "bot@arboris.local"
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            COMMIT_MSG="${{ steps.run_engine.outputs.commit_message || '[game-data] atualizar dados do jogo' }}"
            git commit -m "$COMMIT_MSG"
            git push origin HEAD
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment success and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const committed = '${{ steps.commit_data.outputs.committed }}' === 'true';
            const message = committed
              ? 'Solicitacao processada com sucesso. Os arquivos JSON foram atualizados e o deploy do GitHub Pages sera reexecutado automaticamente.'
              : 'Solicitacao validada, mas nao houve alteracao nova para gravar.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Falha ao processar esta solicitacao. Verifique os logs do workflow Process Game Issue.'
            });
