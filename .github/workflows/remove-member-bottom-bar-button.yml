name: Remove member bottom bar button

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/remove-member-bottom-bar-button.py'
      - '.github/workflows/remove-member-bottom-bar-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch script
        run: python scripts/remove-member-bottom-bar-button.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: remove member button from collaborator bottom bar"
            git push
          fi
