; ====================================================================
; ARBORIS - PHP-FPM POOL CONFIGURATION FOR 512 MB RAM LINUX VPS
; Install path on Debian/Ubuntu: /etc/php/8.2/fpm/pool.d/arboris.conf
; Target: Peak PHP footprint < 150 MB total across all workers
; ====================================================================

[arboris]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management Strategy
; Dynamic with tight caps keeps memory low when idle and scales during bursts
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Hard Resource Limits per Worker
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 15
php_admin_value[max_input_time] = 15
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M

; OPcache Optimization (Pre-parsed bytecode in 32MB shared memory)
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 32
php_admin_value[opcache.interned_strings_buffer] = 4
php_admin_value[opcache.max_accelerated_files] = 2000
php_admin_value[opcache.validate_timestamps] = 0 ; In production, set to 0 for maximum speed
php_admin_value[opcache.revalidate_freq] = 0

; Security Hardening
php_admin_value[expose_php] = Off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php8.2-fpm-arboris.log

; Process Termination & Health
request_terminate_timeout = 20s
catch_workers_output = yes
decorate_workers_output = no
