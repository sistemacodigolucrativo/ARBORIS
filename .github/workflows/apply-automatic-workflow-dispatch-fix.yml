name: Apply automatic workflow dispatch fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply-automatic-workflow-dispatch-fix.py
      - .github/workflows/apply-automatic-workflow-dispatch-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-automatic-workflow-dispatch-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply automatic workflow dispatch fix
        run: python scripts/apply-automatic-workflow-dispatch-fix.py

      - name: Show diff
        run: git diff -- src/App.tsx src/services/dataStore.ts .github/workflows/process-game-dispatch.yml docs/ACTION_DISPATCHER.md docs/cloudflare-worker-arboris-dispatcher.js

      - name: Run game tests
        run: npm run test:game

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet -- src/App.tsx src/services/dataStore.ts .github/workflows/process-game-dispatch.yml docs/ACTION_DISPATCHER.md docs/cloudflare-worker-arboris-dispatcher.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/dataStore.ts .github/workflows/process-game-dispatch.yml docs/ACTION_DISPATCHER.md docs/cloudflare-worker-arboris-dispatcher.js
          git commit -m "fix: add secure automatic workflow dispatcher"
          git push origin main
