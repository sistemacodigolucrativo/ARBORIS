name: Apply Admin Tree UI Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'temporary admin tree UI patch script') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/apply-admin-tree-ui.py

      - name: Commit patched App
        run: |
          git config user.name "Arboris Bot"
          git config user.email "bot@arboris.local"
          git add src/App.tsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add admin tree delete button"
            git push
          fi
