name: Apply collapsed admin actions and pix fixes v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-collapsed-admin-actions-and-pix-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make marketing replacement tolerant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-collapsed-admin-actions-and-pix.py')
          s = p.read_text()
          old = """s = replace_once(s,\n\"❌ Sem dinheiro real, sem PIX e sem depósitos.\",\n\"❌ Sem taxas obrigatórias, sem depósitos no sistema e sem promessa financeira.\",\npath, 'marketing no pix contradiction')"""
          new = """s = s.replace(\n    \"❌ Sem dinheiro real, sem PIX e sem depósitos.\",\n    \"❌ Sem taxas obrigatórias, sem depósitos no sistema e sem promessa financeira.\"\n)"""
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Apply patch script
        run: python scripts/apply-collapsed-admin-actions-and-pix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Backend tests
        run: npm run test:api
      - name: Game tests
        run: npm run test:game
      - name: Build frontend
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types/game.ts src/services/dataStore.ts server/actions.ts server/db.ts server/migrations/001_initial.sql server/migrations/003_user_pix.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: collapse tree actions and add pix settings"
            git push
          fi
