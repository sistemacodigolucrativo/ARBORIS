name: Apply latest coordinator fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-latest-coordinator-fixes.py'
      - '.github/workflows/apply-latest-coordinator-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch script
        run: python3 scripts/apply-latest-coordinator-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Backend tests
        run: npm run test:api
      - name: Game tests
        run: npm run test:game
      - name: Build frontend
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add src/App.tsx src/services/adminGameEngine.ts
            git commit -m "fix: allow members across multiple trees"
            git push
          else
            echo "No changes to commit."
          fi
