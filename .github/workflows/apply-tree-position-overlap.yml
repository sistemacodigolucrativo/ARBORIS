name: Apply tree position overlap patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-tree-position-overlap.mjs'
      - '.github/workflows/apply-tree-position-overlap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch script
        run: node scripts/patch-tree-position-overlap.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Backend tests
        run: npm run test:api
      - name: Game tests
        run: npm run test:game
      - name: Build frontend
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-tree-position-overlap.mjs .github/workflows/apply-tree-position-overlap.yml
          git add src/App.tsx
          git commit -m "fix: prevent radial tree position overlap"
          git push origin main
